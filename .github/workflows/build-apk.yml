name: Build Flutter APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Create Flutter project and copy only android folder
        run: |
          cd mobile
          # Create temp project
          cd ..
          rm -rf temp_flutter
          mkdir temp_flutter
          cd temp_flutter
          flutter create --org com.mesange --project-name mesange --platforms android .
          
          # Copy only android folder to mobile
          cp -r android ../mesange/mobile/
          
          # Go back to mobile and fix dependencies
          cd ../mesange/mobile
          sed -i 's/flutter_local_notifications: .*/flutter_local_notifications: ^17.0.0/' pubspec.yaml
          flutter pub get
      
      - name: Build APK
        run: |
          cd mobile
          flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mesange-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: Mesange v1.0.0
          body: |
            ## Mesange Messenger v1.0.0
            
            ### Features
            - ✅ Direct Messages (DMs)
            - ✅ WebRTC Video/Audio Calls
            - ✅ Game Detection Overlay
            - ✅ Modern Dark UI Redesign
            - ✅ Mobile App (Flutter)
            - ✅ Desktop App with Overlay (PyQt6)
            
            ### How to Install
            1. Download the APK below
            2. Enable "Install from unknown sources" in settings
            3. Install and enjoy!
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}