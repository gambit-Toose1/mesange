<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Messenger Pro</title>
    <meta name="theme-color" content="#1a1a2e">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        #auth-screen {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }

        .auth-box {
            background: rgba(255,255,255,0.1); padding: 40px; border-radius: 15px;
            backdrop-filter: blur(10px); width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .auth-box h2 { text-align: center; margin-bottom: 30px; color: #00d9ff; }

        .auth-box input {
            width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 8px;
            background: rgba(255,255,255,0.2); color: #fff; font-size: 16px;
        }

        .auth-box input::placeholder { color: #aaa; }

        .auth-box button {
            width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 8px;
            background: #00d9ff; color: #1a1a2e; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }

        .auth-box button:hover { background: #00b8d9; transform: translateY(-2px); }

        .auth-box .toggle { text-align: center; margin-top: 20px; color: #aaa; cursor: pointer; }
        .auth-box .toggle:hover { color: #00d9ff; }

        #app-screen { display: none; width: 100%; height: 100%; }

        .sidebar {
            width: 280px; background: rgba(0,0,0,0.3);
            border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column;
        }

        .user-info {
            padding: 20px; background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .user-info h3 { color: #00d9ff; }
        .user-info p { color: #aaa; font-size: 14px; margin-top: 5px; }

        .admin-badge {
            display: inline-block; background: #ff6b6b; color: white;
            padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-left: 5px;
        }

        .rooms-list { flex: 1; overflow-y: auto; padding: 10px; }

        .room-item {
            padding: 15px; margin: 5px 0; background: rgba(255,255,255,0.05);
            border-radius: 8px; cursor: pointer; transition: 0.3s;
            display: flex; justify-content: space-between; align-items: center;
        }

        .room-item:hover { background: rgba(255,255,255,0.1); }
        .room-item.active { background: rgba(0,217,255,0.2); border-left: 3px solid #00d9ff; }

        .room-item h4 { margin-bottom: 5px; }
        .room-item p { font-size: 12px; color: #aaa; }

        .delete-room-btn {
            background: #ff6b6b; border: none; color: white; padding: 5px 10px;
            border-radius: 5px; cursor: pointer; font-size: 12px; display: none;
        }

        .admin .delete-room-btn { display: block; }

        .create-room { padding: 20px; border-top: 1px solid rgba(255,255,255,0.1); }

        .create-room input {
            width: 100%; padding: 10px; border: none; border-radius: 8px;
            background: rgba(255,255,255,0.1); color: #fff; margin-bottom: 10px;
        }

        .create-room button {
            width: 100%; padding: 10px; border: none; border-radius: 8px;
            background: #00d9ff; color: #1a1a2e; font-weight: bold; cursor: pointer;
        }

        .chat-area { flex: 1; display: flex; flex-direction: column; }

        .chat-header {
            padding: 20px; background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center;
        }

        .chat-header h2 { color: #00d9ff; }

        .online-count { color: #51cf66; font-size: 14px; }

        #messages { flex: 1; padding: 20px; overflow-y: auto; }

        .message { margin-bottom: 15px; max-width: 70%; position: relative; }

        .message.own { margin-left: auto; text-align: right; }

        .message-bubble {
            display: inline-block; padding: 12px 18px; border-radius: 18px;
            background: rgba(255,255,255,0.1);
        }

        .message.own .message-bubble { background: #00d9ff; color: #1a1a2e; }

        .message-username { font-size: 12px; color: #00d9ff; margin-bottom: 5px; }
        .message-time { font-size: 11px; color: #666; margin-top: 5px; }

        .delete-msg-btn {
            position: absolute; top: -5px; right: -5px; background: #ff6b6b;
            border: none; color: white; width: 20px; height: 20px;
            border-radius: 50%; cursor: pointer; font-size: 12px; display: none;
        }

        .admin .delete-msg-btn { display: block; }

        .system-message {
            text-align: center; color: #666; font-style: italic; font-size: 13px; margin: 10px 0;
        }

        #input-area {
            padding: 20px; background: rgba(0,0,0,0.2); display: flex; gap: 10px;
        }

        #input-area input {
            flex: 1; padding: 15px; border: none; border-radius: 25px;
            background: rgba(255,255,255,0.1); color: #fff; font-size: 16px;
        }

        #input-area button {
            padding: 15px 30px; border: none; border-radius: 25px;
            background: #00d9ff; color: #1a1a2e; font-weight: bold; cursor: pointer; transition: 0.3s;
        }

        #input-area button:hover { background: #00b8d9; }

        .error { color: #ff6b6b; font-size: 14px; text-align: center; margin-top: 10px; }

        #admin-panel {
            display: none; position: fixed; top: 0; right: 0; width: 400px; height: 100%;
            background: rgba(26, 26, 46, 0.98); border-left: 1px solid rgba(255,255,255,0.1);
            z-index: 500; overflow-y: auto;
        }

        .admin-panel-header {
            padding: 20px; background: rgba(0,0,0,0.3);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0;
        }

        .admin-panel-header h2 { color: #ff6b6b; }

        .close-admin { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }

        .admin-section { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .admin-section h3 { color: #00d9ff; margin-bottom: 15px; }

        .user-list-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 10px;
        }

        .user-list-item .user-info { background: none; padding: 0; border: none; }
        .user-list-item .user-info h3 { font-size: 14px; margin: 0; }
        .user-list-item .user-info p { font-size: 11px; margin: 3px 0 0 0; }

        .user-actions { display: flex; gap: 5px; }

        .user-actions button {
            padding: 5px 10px; border: none; border-radius: 5px; cursor: pointer; font-size: 11px;
        }

        .btn-ban { background: #ff6b6b; color: white; }
        .btn-unban { background: #51cf66; color: white; }
        .btn-admin { background: #ffd43b; color: #1a1a2e; }

        .online-indicator {
            width: 8px; height: 8px; border-radius: 50%;
            display: inline-block; margin-right: 5px;
        }

        .online-indicator.online { background: #51cf66; }
        .online-indicator.offline { background: #666; }

        .banned-indicator {
            background: #ff6b6b; color: white; padding: 2px 6px;
            border-radius: 5px; font-size: 10px; margin-left: 5px;
        }

        #admin-toggle {
            display: none; padding: 10px 20px; background: #ff6b6b;
            color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
        }

        .admin #admin-toggle { display: block; }

        #typing-indicator {
            display: none; padding: 10px 20px; color: #666; font-style: italic;
        }

        .notification {
            position: fixed; top: 20px; right: 20px; background: #00d9ff;
            color: #1a1a2e; padding: 15px 25px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 2000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .emoji-picker {
            position: absolute; bottom: 80px; right: 30px;
            background: rgba(0,0,0,0.9); border-radius: 10px;
            padding: 10px; display: none; z-index: 100;
        }

        .emoji-picker.show { display: block; }

        .emoji-btn {
            font-size: 24px; cursor: pointer; padding: 5px;
            transition: 0.2s; display: inline-block;
        }

        .emoji-btn:hover { transform: scale(1.3); }

        .message-edited { font-size: 10px; color: #666; font-style: italic; }
    </style>
</head>
<body>
<div id="auth-screen">
    <div class="auth-box">
        <h2 id="auth-title">Вход</h2>
        <input type="text" id="auth-username" placeholder="Имя пользователя">
        <input type="password" id="auth-password" placeholder="Пароль">
        <div id="auth-error" class="error"></div>
        <button id="auth-btn" onclick="handleAuth()">Войти</button>
        <div class="toggle" onclick="toggleAuth()">Нет аккаунта? Зарегистрироваться</div>
    </div>
</div>

<div id="app-screen">
    <div class="sidebar">
        <div class="user-info">
            <h3 id="current-user">User</h3>
            <p>Онлайн <span id="admin-badge" class="admin-badge" style="display:none;">ADMIN</span></p>
        </div>
        <div class="rooms-list" id="rooms-list"></div>
        <div class="create-room">
            <input type="text" id="new-room-name" placeholder="Название комнаты">
            <input type="text" id="new-room-desc" placeholder="Описание">
            <button onclick="createRoom()">Создать комнату</button>
        </div>
    </div>

    <div class="chat-area">
        <div class="chat-header">
            <h2 id="current-room">#general</h2>
            <div style="display: flex; gap: 10px; align-items: center;">
                <span class="online-count" id="online-count">🟢 0 онлайн</span>
                <button id="admin-toggle" onclick="toggleAdminPanel()">🛡️ Админ</button>
            </div>
        </div>
        <div id="messages"></div>
        <div id="typing-indicator"><span id="typing-user"></span> печатает...</div>
        <div id="input-area">
            <input type="text" id="message-input" placeholder="Введите сообщение..." onkeypress="handleEnter(event)">
            <button onclick="toggleEmoji()">😊</button>
            <button onclick="sendMessage()">Отправить</button>
        </div>
        <div class="emoji-picker" id="emoji-picker">
            <span class="emoji-btn" onclick="addEmoji('😀')">😀</span>
            <span class="emoji-btn" onclick="addEmoji('😂')">😂</span>
            <span class="emoji-btn" onclick="addEmoji('😍')">😍</span>
            <span class="emoji-btn" onclick="addEmoji('👍')">👍</span>
            <span class="emoji-btn" onclick="addEmoji('❤️')">❤️</span>
            <span class="emoji-btn" onclick="addEmoji('🎉')">🎉</span>
            <span class="emoji-btn" onclick="addEmoji('🔥')">🔥</span>
            <span class="emoji-btn" onclick="addEmoji('✅')">✅</span>
        </div>
    </div>
</div>

<div id="admin-panel">
    <div class="admin-panel-header">
        <h2>🛡️ Админ Панель</h2>
        <button class="close-admin" onclick="toggleAdminPanel()">×</button>
    </div>
    <div class="admin-section">
        <h3>👥 Пользователи</h3>
        <div id="users-list"></div>
    </div>
    <div class="admin-section">
        <h3>📊 Статистика</h3>
        <p id="admin-stats">Загрузка...</p>
    </div>
</div>

<script>
    let currentUser = null;
    let currentRoom = null;
    let currentUserId = null;
    let isAdmin = false;
    let ws = null;
    let isRegister = false;
    let typingTimeout = null;

    function showNotification(message, type = 'info') {
        const notif = document.createElement('div');
        notif.className = 'notification';
        notif.textContent = message;
        notif.style.background = type === 'error' ? '#ff6b6b' : '#00d9ff';
        document.body.appendChild(notif);
        setTimeout(() => notif.remove(), 3000);
    }

    function toggleAuth() {
        isRegister = !isRegister;
        document.getElementById('auth-title').textContent = isRegister ? 'Регистрация' : 'Вход';
        document.getElementById('auth-btn').textContent = isRegister ? 'Зарегистрироваться' : 'Войти';
        document.querySelector('.toggle').textContent = isRegister ?
            'Есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
        document.getElementById('auth-error').textContent = '';
    }

    async function handleAuth() {
        const username = document.getElementById('auth-username').value.trim();
        const password = document.getElementById('auth-password').value.trim();
        const errorDiv = document.getElementById('auth-error');

        if (!username || !password) {
            errorDiv.textContent = 'Заполните все поля';
            return;
        }

        const endpoint = isRegister ? '/api/register' : '/api/login';

        try {
            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);

            const response = await fetch(endpoint, { method: 'POST', body: formData });
            const data = await response.json();

            if (data.success) {
                currentUser = data.username;
                currentUserId = data.user_id || null;
                isAdmin = data.is_admin || false;

                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';
                document.getElementById('current-user').textContent = currentUser;

                if (isAdmin) {
                    document.body.classList.add('admin');
                    document.getElementById('admin-badge').style.display = 'inline-block';
                }

                showNotification(`Добро пожаловать, ${username}!`);
                loadRooms();
                connectWebSocket();
            } else {
                errorDiv.textContent = data.error || 'Ошибка авторизации';
                showNotification(data.error, 'error');
            }
        } catch (e) {
            errorDiv.textContent = 'Ошибка соединения с сервером';
            showNotification('Ошибка соединения', 'error');
        }
    }

    async function loadRooms() {
        try {
            const response = await fetch('/api/rooms');
            const rooms = await response.json();

            const roomsList = document.getElementById('rooms-list');
            roomsList.innerHTML = '';

            rooms.forEach(room => {
                const div = document.createElement('div');
                div.className = 'room-item';
                div.innerHTML = `
                    <div>
                        <h4>${room.is_private ? '🔒' : '#'}${room.name}</h4>
                        <p>${room.description || 'Нет описания'}</p>
                    </div>
                    <button class="delete-room-btn" onclick="deleteRoom(${room.id}, '${room.name}')">🗑️</button>
                `;
                div.onclick = (e) => {
                    if (!e.target.classList.contains('delete-room-btn')) {
                        joinRoom(room.id, room.name);
                    }
                };
                roomsList.appendChild(div);
            });

            if (rooms.length > 0 && !currentRoom) {
                joinRoom(rooms[0].id, rooms[0].name);
            }
        } catch (e) {
            console.error('Ошибка загрузки комнат:', e);
        }
    }

    async function createRoom() {
        const name = document.getElementById('new-room-name').value.trim();
        const desc = document.getElementById('new-room-desc').value.trim();

        if (!name) {
            showNotification('Введите название комнаты', 'error');
            return;
        }

        try {
            const formData = new FormData();
            formData.append('name', name);
            formData.append('description', desc);
            formData.append('username', currentUser);

            const response = await fetch('/api/rooms', { method: 'POST', body: formData });
            const data = await response.json();

            if (data.success) {
                document.getElementById('new-room-name').value = '';
                document.getElementById('new-room-desc').value = '';
                loadRooms();
                showNotification('Комната создана!');
            } else {
                showNotification(data.error, 'error');
            }
        } catch (e) {
            showNotification('Ошибка создания комнаты', 'error');
        }
    }

    async function deleteRoom(roomId, roomName) {
        if (!confirm(`Удалить комнату #${roomName}?`)) return;
        try {
            const response = await fetch(`/api/rooms/${roomId}?username=${currentUser}`, { method: 'DELETE' });
            const data = await response.json();
            if (data.success) {
                loadRooms();
                showNotification('Комната удалена');
            } else {
                showNotification(data.error, 'error');
            }
        } catch (e) {
            showNotification('Ошибка удаления комнаты', 'error');
        }
    }

    function joinRoom(roomId, roomName) {
        if (currentRoom) {
            ws.send(JSON.stringify({ action: 'leave_room' }));
        }
        currentRoom = roomId;
        document.getElementById('current-room').textContent = '#' + roomName;
        document.querySelectorAll('.room-item').forEach(item => {
            item.classList.remove('active');
            if (item.textContent.includes(roomName)) {
                item.classList.add('active');
            }
        });
        loadMessages(roomId);
        ws.send(JSON.stringify({
            action: 'join_room',
            room_id: roomId,
            username: currentUser,
            user_id: currentUserId
        }));
    }

    async function loadMessages(roomId) {
        try {
            const response = await fetch(`/api/messages/${roomId}`);
            const messages = await response.json();
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = '';
            messages.forEach(msg => {
                appendMessage(msg.content, msg.username, msg.created_at, msg.username === currentUser, msg.id, msg.user_id, msg.is_edited);
            });
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        } catch (e) {
            console.error('Ошибка загрузки сообщений:', e);
        }
    }

    function connectWebSocket() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

        ws.onopen = () => {
            console.log('WebSocket подключен');
            if (currentRoom) {
                ws.send(JSON.stringify({
                    action: 'join_room',
                    room_id: currentRoom,
                    username: currentUser,
                    user_id: currentUserId
                }));
            }
            if (isAdmin) loadAdminData();
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'kicked') {
                alert(data.content);
                location.reload();
                return;
            }
            if (data.type === 'message') {
                appendMessage(data.content, data.username, data.created_at, data.username === currentUser, data.id, data.user_id, data.is_edited);
            } else if (data.type === 'system') {
                appendSystemMessage(data.content);
            } else if (data.type === 'typing') {
                showTypingIndicator(data.username);
            }
        };

        ws.onclose = () => {
            console.log('WebSocket отключен, переподключение...');
            setTimeout(connectWebSocket, 3000);
        };
    }

    function appendMessage(content, username, time, isOwn, msgId, userId, isEdited) {
        const messagesDiv = document.getElementById('messages');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isOwn ? 'own' : ''}`;
        const date = new Date(time).toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'});
        msgDiv.innerHTML = `
            <button class="delete-msg-btn" onclick="deleteMessage(${msgId})">×</button>
            <div class="message-bubble">
                ${!isOwn ? `<div class="message-username">${username}</div>` : ''}
                ${content}
                ${isEdited ? '<span class="message-edited">(изм.)</span>' : ''}
                <div class="message-time">${date}</div>
            </div>
        `;
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function appendSystemMessage(content) {
        const messagesDiv = document.getElementById('messages');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'system-message';
        msgDiv.textContent = content;
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function deleteMessage(msgId) {
    if (!msgId || msgId === 'undefined') {
        showNotification('Ошибка: ID сообщения не найден', 'error');
        return;
    }
    if (!confirm('Удалить это сообщение?')) return;
    try {
        const response = await fetch(`/api/messages/${msgId}?username=${currentUser}`, {
            method: 'DELETE'
        });
        const data = await response.json();
        if (!data.success) {
            showNotification(data.error, 'error');
        } else {
            showNotification('Сообщение удалено');
        }
    } catch (e) {
        showNotification('Ошибка удаления сообщения', 'error');
    }
}

    function sendMessage() {
        const input = document.getElementById('message-input');
        const content = input.value.trim();
        if (!content || !currentRoom) return;
        ws.send(JSON.stringify({ action: 'message', content: content }));
        input.value = '';
    }

    function handleEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function toggleAdminPanel() {
        const panel = document.getElementById('admin-panel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        if (panel.style.display === 'block') loadAdminData();
    }

    async function loadAdminData() {
        if (!isAdmin) return;
        try {
            const usersResponse = await fetch(`/api/admin/users?username=${currentUser}`);
            const users = await usersResponse.json();
            const usersList = document.getElementById('users-list');
            usersList.innerHTML = '';
            users.forEach(user => {
                const div = document.createElement('div');
                div.className = 'user-list-item';
                const onlineClass = user.is_online ? 'online' : 'offline';
                div.innerHTML = `
                    <div class="user-info">
                        <h3>
                            <span class="online-indicator ${onlineClass}"></span>
                            ${user.username}
                            ${user.is_admin ? '<span class="admin-badge">ADMIN</span>' : ''}
                            ${user.is_banned ? '<span class="banned-indicator">BAN</span>' : ''}
                        </h3>
                        <p>ID: ${user.id} | ${new Date(user.created_at).toLocaleDateString('ru-RU')}</p>
                    </div>
                    <div class="user-actions">
                        ${!user.is_banned && !user.is_admin ? `<button class="btn-ban" onclick="banUser(${user.id})">Ban</button>` : ''}
                        ${user.is_banned ? `<button class="btn-unban" onclick="unbanUser(${user.id})">Unban</button>` : ''}
                        ${!user.is_admin ? `<button class="btn-admin" onclick="makeAdmin(${user.id})">Admin</button>` : ''}
                    </div>
                `;
                usersList.appendChild(div);
            });
            const onlineResponse = await fetch(`/api/admin/online?username=${currentUser}`);
            const onlineData = await onlineResponse.json();
            const statsResponse = await fetch(`/api/admin/stats?username=${currentUser}`);
            const stats = await statsResponse.json();
            document.getElementById('admin-stats').innerHTML = `
                <p>Всего пользователей: ${stats.total_users}</p>
                <p>Всего комнат: ${stats.total_rooms}</p>
                <p>Всего сообщений: ${stats.total_messages}</p>
                <p>Онлайн: ${onlineData.count}</p>
                <p>Забанено: ${stats.banned_users}</p>
            `;
            document.getElementById('online-count').textContent = `🟢 ${onlineData.count} онлайн`;
        } catch (e) {
            console.error('Ошибка загрузки админ данных:', e);
        }
    }

    async function banUser(userId) {
        if (!confirm('Заблокировать пользователя?')) return;
        try {
            const response = await fetch(`/api/admin/ban/${userId}?username=${currentUser}`, { method: 'POST' });
            const data = await response.json();
            if (data.success) { loadAdminData(); showNotification('Пользователь забанен'); }
            else showNotification(data.error, 'error');
        } catch (e) { showNotification('Ошибка блокировки', 'error'); }
    }

    async function unbanUser(userId) {
        try {
            const response = await fetch(`/api/admin/unban/${userId}?username=${currentUser}`, { method: 'POST' });
            const data = await response.json();
            if (data.success) { loadAdminData(); showNotification('Пользователь разбанен'); }
            else showNotification(data.error, 'error');
        } catch (e) { showNotification('Ошибка разблокировки', 'error'); }
    }

    async function makeAdmin(userId) {
        if (!confirm('Сделать пользователем администратором?')) return;
        try {
            const response = await fetch(`/api/admin/make-admin/${userId}?username=${currentUser}`, { method: 'POST' });
            const data = await response.json();
            if (data.success) { loadAdminData(); showNotification('Пользователь стал админом'); }
            else showNotification(data.error, 'error');
        } catch (e) { showNotification('Ошибка назначения админа', 'error'); }
    }

    function toggleEmoji() {
        document.getElementById('emoji-picker').classList.toggle('show');
    }

    function addEmoji(emoji) {
        document.getElementById('message-input').value += emoji;
        document.getElementById('emoji-picker').classList.remove('show');
    }

    function showTypingIndicator(username) {
        if (username === currentUser) return;
        const indicator = document.getElementById('typing-indicator');
        document.getElementById('typing-user').textContent = username;
        indicator.style.display = 'block';
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
            indicator.style.display = 'none';
        }, 2000);
    }

    document.getElementById('message-input').addEventListener('input', () => {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ action: 'typing' }));
        }
    });
</script>
</body>
</html>
